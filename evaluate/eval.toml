
[[questions]]
question = "What are the three main aspects of the path in Lamrim?"
answer = "The three main aspects of the path are: 1) Renunciation (definite emergence), 2) Bodhichitta (the altruistic intention to attain enlightenment for the sake of all beings), and 3) The correct view of emptiness (wisdom realizing reality). P9 L18"

[[questions]]
question = "Explain the significance of a precious human rebirth."
answer = "A precious human rebirth is significant because it is rare and provides the optimal conditions (leisure and fortune) for practicing the Dharma and attaining enlightenment. It is difficult to obtain and easily lost. P116 L2"

[[questions]]
question = "What is the definition of Karma in the context of Lamrim?"
answer = "Karma refers to the law of cause and effect, where virtuous actions lead to happiness and non-virtuous actions lead to suffering. It is definite, increases over time, and results are never lost. P79 L41"

[[questions]]
question = "Why is meditation on death and impermanence important?"
answer = "Meditating on death and impermanence motivates the practitioner to make the most of their life, avoid procrastination, and focus on Dharma practice, as death is certain but the time of death is uncertain. P111 L42"

[[questions]]
question = "What is Bodhichitta?"
answer = "Bodhichitta is the compassionate wish to attain full enlightenment for the benefit of all sentient beings. It is the entrance to the Mahayana path. P9 L17"
