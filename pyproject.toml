[project]
name = "hierarchical_late_chunking"
version = "0.1.5"
dependencies = [
    "chromadb>=1.0.20",
    "docling>=2.47.0",
    "docling-core>=2.45.0",
    "langgraph>=0.6.6",
    "multipart>=0.2.4",
    "requests>=2.31.0",
    "langchain-google-genai>=2.0.6",
    "langchain-community>=0.3.10",
    "pypdf>=5.1.0",
    "chainlit>=1.3.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1",
    "ragas>=0.2.7"
]

[tool.setuptools]
packages = ["components", "components.embeddings_llm", "components.llm", "components.db"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]